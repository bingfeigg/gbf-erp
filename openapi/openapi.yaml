openapi: 3.0.3
info:
  title: GBF ERP API
  version: "0.2.2"
  description: |
    通用贸易 MVP 后端 HTTP 接口（**精简说明**）。完整行为以 `src/routes` 与 Zod schema 为准。

    - 成功响应多为 `application/json`；错误体由全局错误处理统一包装。
    - 鉴权：除 `/health`、`/api/auth/login`、`/api/auth/refresh`、`/api/license/status`、`POST /api/license/install-bootstrap` 外，一般需 `Authorization: Bearer <access_token>`。非生产且开启 `ALLOW_DEV_HEADER_AUTH` 时可用 `x-username` 代替 Bearer（见 `.env.example`）。
    - **许可证闸**：配置验签公钥且当前无有效许可证（且非试用放行）时，其它需鉴权类接口可能返回 **402** `{ message, code: "LICENSE_INVALID" }`（详见 `src/middleware/license-gate.ts` 豁免列表）。

servers:
  - url: http://localhost:3100
    description: 本地默认端口

tags:
  - name: health
  - name: auth
  - name: master
  - name: orders
  - name: finance
  - name: approvals
  - name: config
  - name: audit
  - name: license

paths:
  /health:
    get:
      tags: [health]
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录（返回 access + refresh）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: token 等
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前用户
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/auth/permissions:
    get:
      tags: [auth]
      summary: 当前用户权限列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 权限字符串数组

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: 新 token

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 撤销 refresh 会话
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: OK

  /api/license/status:
    get:
      tags: [license]
      summary: 许可证与试用状态（无需登录）
      description: |
        供登录页与控制横幅使用。返回 `installationId`（本机部署 UUID）、`enforcement` / `valid`、试用期与到期提示等（ exact 字段以运行时代码为准）。
        **公网部署注意**：未鉴权即可读取上述元数据，建议网络层限制访问或对应该路径单独限速。
      security: []
      responses:
        "200":
          description: 状态 JSON（结构随 enforcement / valid / 试用变化）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseStatusResponse" }

  /api/license/install-bootstrap:
    post:
      tags: [license]
      summary: 首次写入许可证（管理员用户名密码 + 许可证正文，无需 Bearer）
      description: |
        仅在已配置验签公钥且当前许可证无效或缺失时使用；与登录接口共用登录失败计数等防护。成功响应含 `ok` 与最新 `status`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseBootstrapBody" }
      responses:
        "200":
          description: "{ ok: true, status: … }"
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: 当前未启用公钥校验、或许可证已有效等
        "401":
          description: 用户名或密码错误
        "403":
          description: 非 admin 账号

  /api/license/install:
    post:
      tags: [license]
      summary: 安装或更新许可证（需管理员 JWT）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseInstallBody" }
      responses:
        "200":
          description: "{ ok: true, status: … }"
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: JSON 无效或许可证校验失败
        "403":
          description: 非 admin

  /api/suppliers:
    get:
      tags: [master]
      summary: 供应商列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      tags: [master]
      summary: 创建供应商
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerBody" }
      responses:
        "201":
          description: Created

  /api/customers:
    get:
      tags: [master]
      summary: 客户列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      tags: [master]
      summary: 创建客户
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerBody" }
      responses:
        "201":
          description: Created

  /api/products:
    get:
      tags: [master]
      summary: 商品列表（含库存汇总）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      tags: [master]
      summary: 创建商品（需 stock:write 或 product:write）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductBody" }
      responses:
        "201":
          description: Created

  /api/stock/ledger:
    get:
      tags: [master]
      summary: 库存流水
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

  /api/purchase-orders:
    get:
      tags: [orders]
      summary: 采购单列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      tags: [orders]
      summary: 创建采购单（草稿）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseOrderCreate" }
      responses:
        "201":
          description: Created

  /api/purchase-orders/{id}:
    get:
      tags: [orders]
      summary: 采购单详情（表头 + 明细行）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: "{ order, items }"
        "404":
          description: Not found

  /api/purchase-orders/{id}/action:
    post:
      tags: [orders]
      summary: 采购单动作（提交/审批/驳回/作废/冲销）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderActionBody" }
      responses:
        "200":
          description: 新状态等

  /api/sales-orders:
    get:
      tags: [orders]
      summary: 销售单列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      tags: [orders]
      summary: 创建销售单（草稿）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesOrderCreate" }
      responses:
        "201":
          description: Created

  /api/sales-orders/{id}:
    get:
      tags: [orders]
      summary: 销售单详情（表头 + 明细行）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: "{ order, items }"

  /api/sales-orders/{id}/action:
    post:
      tags: [orders]
      summary: 销售单动作
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderActionBody" }
      responses:
        "200":
          description: OK

  /api/ar/invoices:
    get:
      tags: [finance]
      summary: 应收发票列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

  /api/ap/bills:
    get:
      tags: [finance]
      summary: 应付账单列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

  /api/finance/receipts:
    post:
      tags: [finance]
      summary: 创建收款单
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptBody" }
      responses:
        "201":
          description: Created

  /api/finance/payments:
    post:
      tags: [finance]
      summary: 创建付款单
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentBody" }
      responses:
        "201":
          description: Created

  /api/finance/accounts:
    get:
      tags: [finance]
      summary: 会计科目
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

  /api/finance/journals:
    get:
      tags: [finance]
      summary: 凭证/日记账列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

  /api/approvals/pending:
    get:
      tags: [approvals]
      summary: 待我审批（需对应 approve 权限）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 混合类型列表

  /api/approvals/{orderType}/{id}/timeline:
    get:
      tags: [approvals]
      summary: 审批时间线
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderType
          in: path
          required: true
          schema: { type: string, enum: [purchase, sales] }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 审计时间线

  /api/config/webhooks:
    get:
      tags: [config]
      summary: Webhook 端点列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      tags: [config]
      summary: 创建 Webhook
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created

  /api/config/webhooks/{id}:
    delete:
      tags: [config]
      summary: 删除 Webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK

  /api/audit-logs:
    get:
      tags: [audit]
      summary: 审计日志
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access token（`typ=access`）

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    LicenseStatusResponse:
      type: object
      additionalProperties: true
      description: |
        `enforcement: false` 时通常含 `valid`、`installationId`、`trialUiActive` 等；
        `enforcement: true` 时常含 `reason`、`expiresAt`、`trialActive`、`daysRemaining` 等。以 `src/license.ts` 中 `LicenseStatusResponse` 为准。

    LicenseInstallBody:
      type: object
      required: [licenseJson]
      properties:
        licenseJson:
          type: string
          minLength: 10
          description: 与磁盘 `license.json` 一致的完整 JSON 字符串

    LicenseBootstrapBody:
      type: object
      required: [username, password, licenseJson]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        licenseJson:
          type: string
          minLength: 10

    LoginBody:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 6 }

    PartnerBody:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        contact: { type: string }
        phone: { type: string }

    ProductBody:
      type: object
      required: [sku, name, unit, costPrice, salePrice]
      properties:
        sku: { type: string, minLength: 2 }
        name: { type: string, minLength: 2 }
        unit: { type: string, minLength: 1 }
        costPrice: { type: number, minimum: 0 }
        salePrice: { type: number, minimum: 0 }

    OrderLine:
      type: object
      required: [productId, qty, price]
      properties:
        productId: { type: integer, minimum: 1 }
        qty: { type: number, minimum: 0 }
        price: { type: number, minimum: 0 }

    PurchaseOrderCreate:
      type: object
      required: [orderNo, supplierId, items]
      properties:
        orderNo: { type: string, minLength: 3 }
        supplierId: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLine" }

    SalesOrderCreate:
      type: object
      required: [orderNo, customerId, items]
      properties:
        orderNo: { type: string, minLength: 3 }
        customerId: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLine" }

    OrderActionBody:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [submit, approve, reject, void, reverse]
        comment: { type: string, maxLength: 200 }

    ReceiptBody:
      type: object
      required: [receiptNo, customerId, amount]
      properties:
        receiptNo: { type: string, minLength: 3 }
        customerId: { type: integer, minimum: 1 }
        arInvoiceId: { type: integer, minimum: 1 }
        amount: { type: number, minimum: 0 }

    PaymentBody:
      type: object
      required: [paymentNo, supplierId, amount]
      properties:
        paymentNo: { type: string, minLength: 3 }
        supplierId: { type: integer, minimum: 1 }
        apBillId: { type: integer, minimum: 1 }
        amount: { type: number, minimum: 0 }
